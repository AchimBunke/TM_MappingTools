    <script type="importmap"></script>
    <script>
        (function () {
            var t = localStorage.getItem('tm-theme') || 'dark';
            if (t === 'dark')
                document.documentElement.setAttribute('data-theme', 'dark');
            else
                document.documentElement.removeAttribute('data-theme');
        })()
    </script>

    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="icon" type="image/png" href="icon-32.png" />
    <link href="TM_MappingTools.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script src="js/app.js"></script>
    <script>
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                if (type === 'dotnetjs') {
                    // This resource must be a URI string, not a custom fetch/Response
                    return defaultUri;
                }
                if (type === 'manifest') {
                    // Only the boot manifest needs forced revalidation
                    return fetch(defaultUri, { cache: 'no-cache' });
                }
                // Everything else: normal caching, integrity check intact
                return fetch(defaultUri, { integrity: integrity, cache: 'default' });
            }
        });
    </script>
    <script src="js/app.js"></script>
</body>

</html>
